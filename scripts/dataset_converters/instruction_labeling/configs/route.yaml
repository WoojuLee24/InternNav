# route 그룹의 텍스트·표 자원 (버전 키로 고정; 바꾸려면 새 키를 추가한다)
words:                      # route.words
  v1:                       # = vln-s2-pipeline ROUTE_WORDS (b0)
    around: "turn around"
    turn: "turn {side}"
    slight: "bear slightly {side}"
    start_turn: "{turn} (the route does not start in the direction you face)."
start_turn_rate:            # route.start_turn=<key> 일 때: 시작 회전 각도 구간별로 말할 확률 [lo, hi, p]
  gtrate-v1: [[0, 30, 0.0], [30, 90, 0.143], [90, 135, 0.225], [135, 181, 0.245]]   # GT train 10,819 문장 실측 (2026-10-14)
rooms:                      # route.rooms=<key>: MP3D .house 방 정보로 "지나는 방 순서" 한 줄을 경로 단어 뒤에 붙인다 (label/rooms.py)
  house-v1:
    step_m: 0.25            # reference_path 를 이 간격으로 촘촘히 해서 점마다 방을 찾는다
    max_dz_m: 1.0           # 점 바닥 높이와 방 바닥 높이 차 허용
    min_visit_m: 1.0        # 이보다 짧게 지나는 방은 뺀다 (처음·끝 방 제외)
    joiner: " -> "
    line: "Rooms along the path (from scene annotation): {rooms}. You stop in the {goal}."
    names:                  # MP3D region label 코드 -> 이름 (z/-/Z 등은 말하지 않음)
      a: bathroom
      b: bedroom
      c: closet
      d: dining room
      e: entryway
      f: family room
      g: garage
      h: hallway
      i: library
      j: laundry room
      k: kitchen
      l: living room
      m: meeting room
      n: lounge
      o: office
      p: porch
      r: game room
      s: stairs
      t: toilet
      u: utility room
      v: tv room
      w: gym
      x: outdoor area
      y: balcony
      B: bar
      C: classroom
      D: dining booth
      S: spa
  house-v2:                 # v1 + 복도는 3 m 이상 지날 때만 + "leave the X, enter the Y" 동사 형태 (GT 의 exit/enter 표현을 겨냥)
    step_m: 0.25
    max_dz_m: 1.0
    min_visit_m: 1.5
    min_visit_by_label: {h: 3.0, s: 1.0}
    form: verbs
    joiner: ", "
    leave: "leave the {room}"
    enter: "enter the {room}"
    line: "Room changes along the path (from scene annotation): {changes}. You stop in the {goal}."
    single_line: "The whole path stays in the {goal} (from scene annotation)."
    names:
      a: bathroom
      b: bedroom
      c: closet
      d: dining room
      e: entryway
      f: family room
      g: garage
      h: hallway
      i: library
      j: laundry room
      k: kitchen
      l: living room
      m: meeting room
      n: lounge
      o: office
      p: porch
      r: game room
      s: stairs
      t: toilet
      u: utility room
      v: tv room
      w: gym
      x: outdoor area
      y: balcony
      B: bar
      C: classroom
      D: dining booth
      S: spa
stop_cue:                   # route.stop_cue=<key>: 정지 단서 (label/stop_cues.py). none = b0 (VLM 이 도착 이미지에서 스스로 고름)
  A-grounded-v1:            # 정지 지점 근처의, 마지막 프레임에 보이는 annotation 물체 하나를 경로 단어 뒤에 사실로 넣는다
    kind: A
    max_dist_m: 2.0         # 정지 지점(수평)과 물체 bbox 사이 거리
    min_height_m: -0.2      # 물체 중심 높이 (정지 지점 바닥 기준)
    max_height_m: 2.2
    min_cam_dist_m: 0.3
    occl_tol_m: 0.3         # depth 가 (카메라-점 거리 - 이 값) 이상이면 안 가려진 것으로 본다
    ahead_deg: 20           # |방위| 이 각도 안이면 "ahead"
    side_rig: 125cm_0deg
    camera_height_m: 1.25
    max_n: 1
    line: "You stop next to the {name}{side} (from scene annotation)."
    side_words: {left: ", on your left", right: ", on your right", ahead: ", right in front of you"}
    names:                  # mpcat40 -> 지시문 단어. 없는 범주(wall/floor/ceiling/misc/objects/void/beam/column/blinds/board_panel/lighting/curtain/window/picture)는 쓰지 않는다
      chair: chair
      door: door
      table: table
      cabinet: cabinet
      sofa: couch
      bed: bed
      chest_of_drawers: dresser
      plant: plant
      sink: sink
      stairs: stairs
      toilet: toilet
      stool: stool
      mirror: mirror
      tv_monitor: tv
      shower: shower
      bathtub: bathtub
      counter: counter
      fireplace: fireplace
      railing: railing
      shelving: shelf
      gym_equipment: exercise machine
      seating: bench
      furniture: furniture
      appliances: appliance
  A-grounded-v2:            # v1 + 물체 중심이 보여야 함 + 문은 정면일 때만 + 큰 가구 우선 정렬
    kind: A
    max_dist_m: 2.0
    min_height_m: -0.2
    max_height_m: 2.2
    min_cam_dist_m: 0.3
    occl_tol_m: 0.3
    ahead_deg: 20
    side_rig: 125cm_0deg
    camera_height_m: 1.25
    max_n: 1
    line: 'You stop next to the {name}{side} (from scene annotation).'
    side_words:
      left: ', on your left'
      right: ', on your right'
      ahead: ', right in front of you'
    names:
      chair: 'chair'
      door: 'door'
      table: 'table'
      cabinet: 'cabinet'
      sofa: 'couch'
      bed: 'bed'
      chest_of_drawers: 'dresser'
      plant: 'plant'
      sink: 'sink'
      stairs: 'stairs'
      toilet: 'toilet'
      stool: 'stool'
      mirror: 'mirror'
      tv_monitor: 'tv'
      shower: 'shower'
      bathtub: 'bathtub'
      counter: 'counter'
      fireplace: 'fireplace'
      railing: 'railing'
      shelving: 'shelf'
      gym_equipment: 'exercise machine'
      seating: 'bench'
      furniture: 'furniture'
      appliances: 'appliance'
    center_visible: True
    ahead_only: [door]
    size_weight: 0.15
  P-v1:                     # 장소·사건: 계단 위/아래, 문간(door 물체 근처, 방금 들어온 방이면 방 이름), 방 입구 바로 안쪽, 복도 끝
    kind: P
    types: [stairs, doorway, hall_end]
    camera_height_m: 1.25
    max_dz_m: 1.0
    stairs_window_m: 3.0      # 마지막 3 m 구간 높이 변화
    stairs_dz_m: 0.4
    door_dist_m: 0.8          # 정지 지점과 door 물체 bbox 수평 거리
    door_window_m: 1.5        # 이만큼 전의 방과 정지 지점 방이 다르면 '방금 들어옴'
    entry_edge_m: 1.0         # 방 경계에서 이 안이면 'just inside'
    hall_end_m: 1.0           # 진행 방향 앞 1 m 가 다른 영역이면 복도 끝
    line: "You stop {phrase} (from scene annotation)."
    phrases:
      stairs_top: "at the top of the stairs"
      stairs_bottom: "at the bottom of the stairs"
      doorway: "in the doorway"
      doorway_room: "in the doorway of the {room}"
      just_inside: "just inside the {room}"
      hall_end: "at the end of the hallway"
      room: "in the {room}"
    room_names:
      a: bathroom
      b: bedroom
      c: closet
      d: dining room
      e: entryway
      f: family room
      g: garage
      h: hallway
      i: library
      j: laundry room
      k: kitchen
      l: living room
      m: meeting room
      n: lounge
      o: office
      p: porch
      r: game room
      t: toilet
      u: utility room
      v: tv room
      w: gym
      x: outdoor area
      y: balcony
      B: bar
      C: classroom
      D: dining booth
      S: spa
  P-v2:                     # P-v1 - 방 입구 'just inside'(GT 동의 < 기본 비율) - 복도 끝(드묾·부정확). 문간·계단만
    kind: "P"
    types: [stairs, doorway]
    camera_height_m: 1.25
    max_dz_m: 1.0
    stairs_window_m: 3.0
    stairs_dz_m: 0.4
    door_dist_m: 0.8
    door_window_m: 1.5
    entry_edge_m: 1.0
    hall_end_m: 1.0
    line: "You stop {phrase} (from scene annotation)."
    phrases:
      stairs_top: "at the top of the stairs"
      stairs_bottom: "at the bottom of the stairs"
      doorway: "in the doorway"
      doorway_room: "in the doorway of the {room}"
      just_inside: "just inside the {room}"
      hall_end: "at the end of the hallway"
      room: "in the {room}"
    room_names:
      a: "bathroom"
      b: "bedroom"
      c: "closet"
      d: "dining room"
      e: "entryway"
      f: "family room"
      g: "garage"
      h: "hallway"
      i: "library"
      j: "laundry room"
      k: "kitchen"
      l: "living room"
      m: "meeting room"
      n: "lounge"
      o: "office"
      p: "porch"
      r: "game room"
      t: "toilet"
      u: "utility room"
      v: "tv room"
      w: "gym"
      x: "outdoor area"
      y: "balcony"
      B: "bar"
      C: "classroom"
      D: "dining booth"
      S: "spa"
    entrance: false
  R-v1:                     # 방: 정지 지점이 있는 방 (방v2 와 같은 annotation)
    kind: R
    types: [room]
    camera_height_m: 1.25
    max_dz_m: 1.0
    line: "You stop {phrase} (from scene annotation)."
    phrases:
      room: "in the {room}"
    room_names:
      a: bathroom
      b: bedroom
      c: closet
      d: dining room
      e: entryway
      f: family room
      g: garage
      h: hallway
      i: library
      j: laundry room
      k: kitchen
      l: living room
      m: meeting room
      n: lounge
      o: office
      p: porch
      r: game room
      t: toilet
      u: utility room
      v: tv room
      w: gym
      x: outdoor area
      y: balcony
      B: bar
      C: classroom
      D: dining booth
      S: spa
stop_select:                # route.stop_select=<key>: A·P·R 후보 캐시(label/build_stop_cues.py) 에서 정지 단서를 고르는 방법 (축 2). none = b0
  rule-v1:                  # 규칙: 가장 확실한 하나 — 계단 > 문간 > 물체 > 방
    cache: A-grounded-v1+P-v2+R-v1
    mode: rule
    priority: [stairs_top, stairs_bottom, doorway, A, room]
    line: "You stop {cue} (from scene annotation)."
  vlm-v1:                   # 후보 전부를 주고 VLM 이 이미지에 맞는 하나를 고름
    cache: A-grounded-v1+P-v2+R-v1
    mode: vlm
    priority: [stairs_top, stairs_bottom, doorway, A, room]
    line: "Ways to describe where you stop (from scene annotation; end the instruction with ONE of them that fits the images): {cues}."
    joiner: "; "
  rotate-v1:                # 형제마다 다른 후보 (형제 번호 순으로 우선순위 목록을 돈다)
    cache: A-grounded-v1+P-v2+R-v1
    mode: rotate
    priority: [stairs_top, stairs_bottom, doorway, A, room]
    line: "You stop {cue} (from scene annotation)."
