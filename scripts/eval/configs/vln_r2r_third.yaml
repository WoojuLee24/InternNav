# @package _global_
# 1/3-subset of R2R val_unseen — 613 of 1839 episodes, stratified by scene.
# Created: 2026-06-08 for fast ablation evaluation.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - /habitat/task/actions:
    - look_up
    - look_down
  - _self_

habitat:
  environment:
    max_episode_steps: 5000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    habitat_sim_v0:
      gpu_device_id: 0
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
    actions:
      stop:
        type: StopAction
      move_forward:
        type: MoveForwardAction
      turn_left:
        type: TurnLeftAction
      turn_right:
        type: TurnRightAction
      look_up:
        type: LookUpAction
        tilt_angle: 30
      look_down:
        type: LookDownAction
        tilt_angle: 30

  dataset:
    type: R2RVLN-v1
    split: val_unseen_third
    scenes_dir: data/InternData-N1/scene_data/mp3d_ce
    # Absolute path so it resolves regardless of cwd.
    # Host: /home/kemal/VLNav/habitat_data/datasets/vln/mp3d/r2r/v1/{split}/{split}.json.gz
    # Container: /workspace/InternNav/data/datasets/vln/mp3d/r2r/v1/{split}/{split}.json.gz
    data_path: /workspace/InternNav/data/datasets/vln/mp3d/r2r/v1/{split}/{split}.json.gz
