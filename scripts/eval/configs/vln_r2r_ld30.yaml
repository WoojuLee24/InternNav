# @package _global_
#
# VLN-CE R2R val_unseen (1839 episodes), with the look-down geometry restored to the
# original main-branch behaviour.
#
# Only difference vs vln_r2r_mini.yaml: look_up/look_down tilt_angle 30 -> 15.
#
# Why: habitat_vln_evaluator.py issues TWO consecutive LOOKDOWN steps (and two LOOKUP to
# restore), so the effective look-down pitch is 2 * tilt_angle.
#   main (habitat 0.2.x): simulator.tilt_angle: 15  ->  2 * 15 = 30 deg
#   this branch's yamls  : per-action tilt_angle: 30 ->  2 * 30 = 60 deg
# The training data's look-down is pitch_1 -> pitch_2, i.e. at most 0 -> 30 deg
# (r2r_125cm_0_30 / rxr_125cm_0_30), so 30 deg is what the model was trained on.
# habitat 0.3.3's LookDown/LookUpActionConfig default is already 15; the explicit 30 was
# introduced during the 0.3.x port. vln_rxr.yaml on this branch omits it and thus uses 15.
#
# The existing vln_r2r.yaml / vln_r2r_mini.yaml are left untouched so the 12 previous
# ablation runs (all measured at 60 deg) stay comparable with each other.
#
# NOTE on the "-v0.5-mini" data paths below: they are not a reduced benchmark. mini and full
# ship the identical val_unseen split (1839 episodes / 11 scenes, same json.gz) and the same
# 90 MP3D scenes; only the *training* traj_data differs (mini has no rxr/scalevln). The full
# root has no scene_data/mp3d_ce at all, so these are the paths that actually resolve.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent  # agents -> sensor_setups in habitat 0.3.x
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - /habitat/task/actions:  # look_up/look_down must be explicitly listed in habitat 0.3.x
    - look_up
    - look_down
  - _self_

habitat:
  environment:
    max_episode_steps: 5000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    # tilt_angle: 15  # moved to per-action config in habitat 0.3.x
    # action_space_config: "v1"  # removed in habitat 0.3.x
    habitat_sim_v0:
      gpu_device_id: 0
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
    actions:
      stop:
        type: StopAction
        # agent_index: 0  # removed in habitat 0.3.x
      move_forward:
        type: MoveForwardAction
        # agent_index: 0  # removed in habitat 0.3.x
      turn_left:
        type: TurnLeftAction
        # agent_index: 0  # removed in habitat 0.3.x
      turn_right:
        type: TurnRightAction
        # agent_index: 0  # removed in habitat 0.3.x
      look_up:
        type: LookUpAction
        tilt_angle: 15  # 2 x LOOKUP = 30 deg (main parity)
        # agent_index: 0  # removed in habitat 0.3.x
      look_down:
        type: LookDownAction
        tilt_angle: 15  # 2 x LOOKDOWN = 30 deg (main parity)
        # agent_index: 0  # removed in habitat 0.3.x

  dataset:
    type: R2RVLN-v1
    split: val_unseen
    scenes_dir: data/InternData-N1-v0.5-mini/scene_data/mp3d_ce
    data_path: data/InternData-N1-v0.5-mini/vln_ce/raw_data/r2r/{split}/{split}.json.gz
