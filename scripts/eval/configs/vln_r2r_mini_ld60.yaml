# @package _global_
#
# VLN-CE R2R val_unseen (1839 episodes) — MINI data root, look-down 60 deg.
#
# Effectively identical to the legacy vln_r2r_mini.yaml (which is kept untouched as the
# baseline for the 12 earlier ablation runs and is still referenced from 4 Python files).
# This file exists so the {full,mini} x {ld30,ld60} matrix is complete and every config
# states both axes in its name. verify_yaml.py asserts that its composed config matches
# vln_r2r_mini.yaml key-for-key.
#
# See vln_r2r_full_ld30.yaml for why tilt_angle 30 == 60 deg effective.

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: vln_r2r
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent  # agents -> sensor_setups in habitat 0.3.x
  - /habitat/dataset/vln: mp3d_r2r
  - /habitat/task/lab_sensors:
    - gps_sensor
    - compass_sensor
  - /habitat/task/actions:  # look_up/look_down must be explicitly listed in habitat 0.3.x
    - look_up
    - look_down
  - _self_

habitat:
  environment:
    max_episode_steps: 5000
    iterator_options:
      max_scene_repeat_steps: 50000
      shuffle: False
  simulator:
    agents:
      main_agent:
        sim_sensors:
          rgb_sensor:
            width: 640
            height: 480
            hfov: 79
          depth_sensor:
            width: 640
            height: 480
            hfov: 79
            min_depth: 0.0
            max_depth: 10.0
    forward_step_size: 0.25
    turn_angle: 15
    # tilt_angle: 15  # moved to per-action config in habitat 0.3.x
    # action_space_config: "v1"  # removed in habitat 0.3.x
    habitat_sim_v0:
      gpu_device_id: 0
  task:
    measurements:
      distance_to_goal:
        type: DistanceToGoal
        distance_to: POINT
      success:
        type: Success
        success_distance: 3.0
      spl:
        type: SPL
      oracle_success:
        type: OracleSuccess
      oracle_navigation_error:
        type: OracleNavigationError
    actions:
      stop:
        type: StopAction
        # agent_index: 0  # removed in habitat 0.3.x
      move_forward:
        type: MoveForwardAction
        # agent_index: 0  # removed in habitat 0.3.x
      turn_left:
        type: TurnLeftAction
        # agent_index: 0  # removed in habitat 0.3.x
      turn_right:
        type: TurnRightAction
        # agent_index: 0  # removed in habitat 0.3.x
      look_up:
        type: LookUpAction
        tilt_angle: 30  # 2 x LOOKUP = 60 deg (current branch behaviour)
        # agent_index: 0  # removed in habitat 0.3.x
      look_down:
        type: LookDownAction
        tilt_angle: 30  # 2 x LOOKDOWN = 60 deg (current branch behaviour)
        # agent_index: 0  # removed in habitat 0.3.x

  dataset:
    type: R2RVLN-v1
    split: val_unseen
    scenes_dir: data/InternData-N1-v0.5-mini/scene_data/mp3d_ce
    data_path: data/InternData-N1-v0.5-mini/vln_ce/raw_data/r2r/{split}/{split}.json.gz
