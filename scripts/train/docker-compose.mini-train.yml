# docker-compose.mini-train.yml
# Sequential mini-model training for VLN-CE comparison table
# Models run ONE AT A TIME to share the single RTX 3080 Ti (12GB)
# Usage:  docker compose -f scripts/train/docker-compose.mini-train.yml run --rm navdp
#
# All services share the same image: vlnav/nexusnav-train:local
# Build first:  docker build -f scripts/cloud/Dockerfile.nexusnav -t vlnav/nexusnav-train:local .

version: "3.8"

x-common: &common
  image: vlnav/nexusnav-train:local
  runtime: nvidia
  environment:
    NVIDIA_VISIBLE_DEVICES: "0"
    NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    CUDA_VISIBLE_DEVICES: "0"
    PYTHONPATH: "/workspace/InternNav-dev:/workspace/InternNav:/workspace/InternNav/src/diffusion-policy"
    BITSANDBYTES_NOWELCOME: "1"
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - /home/kemal/VLNav/VLNav/workspaces/model/InternNav-dev:/workspace/InternNav-dev:rw
    - /home/kemal/VLNav/VLNav/workspaces/model/InternNav:/workspace/InternNav:ro
    - /home/kemal/VLNav/VLNav/checkpoints:/checkpoints:ro
    - /mnt/nvme0/vln_habitat:/workspace/InternNav/data:rw
    - /mnt/nvme0/vln_habitat/logs:/workspace/InternNav/logs:rw
  working_dir: /workspace/InternNav-dev
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  # ── Model 1: NavDP baseline ─────────────────────────────────────────────────
  navdp:
    <<: *common
    container_name: vlnav_train_navdp
    command: >
      bash -c "
        pip install bitsandbytes -q &&
        echo '[navdp] Starting training...' &&
        python scripts/train/base_train/train.py \
          --exp-cfg scripts/train/base_train/configs/navdp_vln_ce_mini.py \
          2>&1 | tee /workspace/InternNav/logs/train_navdp_mini.log &&
        echo '[navdp] DONE' &&
        cp checkpoints/navdp_vln_ce_mini/ckpts/last.ckpt /checkpoints/navdp_vln_ce_mini_final.ckpt 2>/dev/null || true
      "

  # ── Model 2: DualVLN baseline ───────────────────────────────────────────────
  dualvln:
    <<: *common
    container_name: vlnav_train_dualvln
    command: >
      bash -c "
        pip install bitsandbytes -q &&
        echo '[dualvln] Starting training...' &&
        python scripts/train/base_train/train.py \
          --exp-cfg scripts/train/base_train/configs/dualsystem_vln_ce_mini.py \
          2>&1 | tee /workspace/InternNav/logs/train_dualvln_mini.log &&
        echo '[dualvln] DONE'
      "

  # ── Model 3: ChronoNav ──────────────────────────────────────────────────────
  chrononav:
    <<: *common
    container_name: vlnav_train_chrononav
    command: >
      bash -c "
        pip install bitsandbytes -q &&
        echo '[chrononav] Starting training...' &&
        python scripts/train/base_train/train.py \
          --exp-cfg scripts/train/base_train/configs/chrononav_vln_ce_mini.py \
          2>&1 | tee /workspace/InternNav/logs/train_chrononav_mini.log &&
        echo '[chrononav] DONE'
      "

  # ── Model 4: NexusNav-V3 ────────────────────────────────────────────────────
  nexusnav:
    <<: *common
    container_name: vlnav_train_nexusnav
    command: >
      bash -c "
        pip install bitsandbytes -q &&
        echo '[nexusnav] Starting training...' &&
        python scripts/train/base_train/train.py \
          --exp-cfg scripts/train/base_train/configs/nexusnav_vln_ce_mini.py \
          2>&1 | tee /workspace/InternNav/logs/train_nexusnav_mini.log &&
        echo '[nexusnav] DONE'
      "
